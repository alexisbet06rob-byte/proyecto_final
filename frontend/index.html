<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor de bomba · DWSSR</title>
</head>
<body class="bg-slate-100 text-slate-800">
  <header class="flex items-center justify-between bg-slate-900 px-6 py-3 text-white">
    <h1 class="text-lg font-semibold">Monitor de bomba · detección de anomalías</h1>
    <div class="flex gap-2 text-xs">
      <span id="b-modo"   class="rounded-full bg-slate-600 px-3 py-1">Sin datos</span>
      <span id="b-broker" class="rounded-full bg-slate-600 px-3 py-1">Broker: …</span>
      <span id="b-motor"  class="rounded-full bg-slate-600 px-3 py-1">Motor: …</span>
    </div>
  </header>

  <main class="mx-auto max-w-6xl space-y-6 p-6">
    <section><h2 class="mb-2 text-sm font-semibold uppercase text-slate-500">Variables medidas</h2>
      <div id="vars" class="grid gap-4 sm:grid-cols-3"></div></section>

    <div class="grid gap-6 lg:grid-cols-2">
      <section><h2 class="mb-2 text-sm font-semibold uppercase text-slate-500">Resultado de los detectores</h2>
        <div id="detectores" class="space-y-2"></div></section>
      <section><h2 class="mb-2 text-sm font-semibold uppercase text-slate-500">Alertas</h2>
        <ul id="alertas" class="space-y-2 text-sm"></ul></section>
    </div>

    <section id="historial"></section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
